services:
  freqtrade-atr-channel:
    image: freqtradeorg/freqtrade:stable
    container_name: freqtrade-atr-channel
    restart: unless-stopped
    entrypoint: ["/bin/sh", "-c"]
    environment:
      - FREQTRADE_TELEGRAM_TOKEN=${FREQTRADE_TELEGRAM_TOKEN}
      - FREQTRADE_TELEGRAM_CHAT_ID=${FREQTRADE_TELEGRAM_CHAT_ID}
    command: "mkdir -p /freqtrade/user_data/strategies && echo '' | base64 -d > /freqtrade/user_data/config.json && echo '' | base64 -d > /freqtrade/user_data/strategies/ATR_CHANNEL_2H.py && freqtrade trade --config /freqtrade/user_data/config.json --strategy ATR_CHANNEL_2H --userdir /freqtrade/user_data"
